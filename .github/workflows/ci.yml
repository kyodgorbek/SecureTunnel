name: SecureTunnel CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 🤖 ANDROID CI/CD WORKFLOW
  # =========================================================================
  android-build-and-test:
    name: 🤖 Android - Test & Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🔑 Configure local.properties
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_demo_ci_key' }}" >> local.properties
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> local.properties

      - name: 🧪 Run Android & Multiplatform Unit Tests
        run: ./gradlew testAndroidHostTest --stacktrace

      - name: 📦 Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: 📊 Upload Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: 📱 Upload Android Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: securetunnel-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  # =========================================================================
  # 🍏 iOS CI/CD WORKFLOW
  # =========================================================================
  ios-build-and-test:
    name: 🍏 iOS - KMP Framework & Xcode Build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 🔑 Configure local.properties
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_demo_ci_key' }}" >> local.properties
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> local.properties

      - name: 🛠️ Build iOS Multiplatform Frameworks
        run: ./gradlew :sharedLogic:linkDebugFrameworkIosSimulatorArm64 :sharedUI:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: 🍎 Build Xcode iOS App (Simulator)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # =========================================================================
  # ☁️ BACKEND & SERVER CI WORKFLOW
  # =========================================================================
  backend-build:
    name: ☁️ Backend - Ktor Microservice Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔧 Make gradlew executable
        run: chmod +x gradlew

      - name: 📦 Build Ktor Backend
        run: ./gradlew :backend:build --stacktrace
