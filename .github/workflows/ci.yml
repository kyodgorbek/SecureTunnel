name: SecureTunnel CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    name: Build & Test Multiplatform Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐘 Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🔑 Configure local.properties
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'gsk_demo_ci_key' }}" >> local.properties
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> local.properties

      - name: 🧪 Run Multiplatform Unit Tests
        run: ./gradlew testAndroidHostTest --stacktrace

      - name: 📦 Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: 📱 Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: securetunnel-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
